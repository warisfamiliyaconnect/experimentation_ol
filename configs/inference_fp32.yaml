# OLMo-2 1B Inference Parameters (FP32 Compute, FP32 Weights)

model:
  path: "artifacts/OLMo-2-0425-1B"
  torch_dtype: "float32"
  device_map: "cuda"
  use_cache: true
  attn_implementation: "sdpa"

generation:
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  do_sample: true
  repetition_penalty: 1.1
  pad_token_id: null
