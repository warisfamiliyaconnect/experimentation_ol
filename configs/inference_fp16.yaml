# OLMo-2 1B Inference Parameters (FP16 Compute, BF16 Weights)

model:
  path: "artifacts/OLMo-2-0425-1B-Instruct-FP16"
  torch_dtype: "float16"       # Pascal executes FP16 natively
  device_map: "cuda"
  use_cache: true
  attn_implementation: "sdpa"  # Scaled Dot Product Attention

generation:
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  do_sample: true
  repetition_penalty: 1.1
  pad_token_id: null
