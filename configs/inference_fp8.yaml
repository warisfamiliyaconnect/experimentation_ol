# OLMo-2 1B Inference Parameters for the Instruct FP8 model

model:
  backend: "pytorch"
  path: "artifacts/OLMo-2-0425-1B-Instruct-FP8"
  torch_dtype: "fp8"
  device_map: "cuda"
  use_cache: true
  attn_implementation: "sdpa"

generation:
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  do_sample: true
  repetition_penalty: 1.1
  pad_token_id: null
