# nginx_blackwell.conf
# ============================================================
# Nginx load balancer for the 4x RTX PRO 6000 Blackwell setup.
#
# Distributes /generate, /health, /metrics traffic across the
# 4 uvicorn workers (one per GPU) using round-robin scheduling.
#
# Usage:
#   sudo nginx -c /path/to/project/nginx_blackwell.conf
#   sudo nginx -c /path/to/project/nginx_blackwell.conf -s reload
#   sudo nginx -c /path/to/project/nginx_blackwell.conf -s stop
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ----------------------------------------------------------------
    # Upstream pool: 4 uvicorn workers, one per GPU
    # ----------------------------------------------------------------
    upstream olmo_workers {
        # Round-robin (default) — each request goes to next available worker
        server 127.0.0.1:8000;
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
        server 127.0.0.1:8003;

        # Optional: mark a worker as backup (will only be used if all others are down)
        # server 127.0.0.1:8003 backup;

        # Keepalive connections to upstream workers (reduces TCP handshake overhead)
        keepalive 32;
    }

    # ----------------------------------------------------------------
    # Server block: public-facing entry point
    # ----------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Long generation requests can take many seconds — generous timeout
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;

        # Pass real client IP to application for logging
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Host              $host;

        # ---- /generate ---- distributed across all 4 GPUs
        location /generate {
            proxy_pass         http://olmo_workers;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ---- /validate ---- lightweight, any worker can handle it
        location /validate {
            proxy_pass         http://olmo_workers;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ---- /health ---- always routes to Worker 0 for consistent status
        location /health {
            proxy_pass         http://127.0.0.1:8000;
            proxy_http_version 1.1;
        }

        # ---- /metrics ---- aggregate from Worker 0 (each worker tracks its own requests)
        location /metrics {
            proxy_pass         http://127.0.0.1:8000;
            proxy_http_version 1.1;
        }

        # ---- /reload ---- broadcast to all workers one at a time
        # Note: call /reload on each port individually (8000-8003) to reload all workers
        location /reload {
            proxy_pass         http://olmo_workers;
            proxy_http_version 1.1;
        }

        # ---- Deny direct access to internal paths ----
        location /docs {
            # Allow Swagger UI only from localhost (disable for strict production)
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://olmo_workers;
        }
    }
}
